# Railway deploy config para VantDomus.
# Le dice a Railway que la app vive en apps/api (no en la raíz del monorepo).
# Builder Nixpacks (detecta Python por requirements.txt en ese directorio).

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r apps/api/requirements.txt"

[deploy]
startCommand = "cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
