name: DOMI P5 Cross-Device Field Beta Certification

on:
  push:
    branches:
      - domi-p5-cross-device-field-beta
      - domi-p5-rc2-windows-chrome-qualification
      - domi-p5-production-admission-contract-draft
      - domi-p5-production-route-binding-security-audit
      - domi-p5-authenticated-owner-scoped-route-binding-contract
      - domi-p5-owner-scoped-binding-integration-harness-draft
      - domi-p5-staging-readiness-gate-design
      - domi-p5-security-event-chain-verifier
      - domi-p5-staging-config-manifests
      - domi-p5-staging-provisioning-preauth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build plus deterministic postbuild gates
        run: npm run build
      - name: Re-run bounded P5 field gates
        run: node --test tests/domi-p5-cross-device-transport.test.mjs tests/domi-p5-cross-device-field-access.test.mjs tests/domi-p5-field-beta-round-trip.test.mjs tests/domi-p5-mobile-to-desktop-return.test.mjs tests/domi-p5-continuity-resume-artifact.test.mjs tests/domi-p5-network-transition.test.mjs tests/domi-p5-device-matrix.test.mjs tests/domi-p5-field-beta-ops.test.mjs tests/domi-p5-production-admission-draft.test.mjs tests/domi-p5-production-route-binding-audit.test.mjs tests/domi-p5-authenticated-owner-scoped-route-binding-contract.test.mjs tests/domi-p5-owner-scoped-binding-integration-harness.test.mjs tests/domi-p5-staging-readiness-gate.test.mjs


  security-event-chain-verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run autonomous security-event-chain verifier fail-closed tests
        run: python -m unittest tests/security/test_security_event_chain_verifier.py -v


  staging-config-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate provider-neutral staging manifest and redacted receipt schema
        run: |
          python tools/staging_manifest_validate.py             --manifest docs/P5_STAGING_CONFIGURATION_MANIFEST_V0_1.json             --receipt-schema docs/P5_STAGING_REDACTED_RECEIPT_SCHEMA_V0_1.json
      - name: Run staging manifest fail-closed tests
        run: python -m unittest tests/security/test_staging_config_manifest.py -v


  staging-provisioning-preauth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate provisioning preauthorization packet
        run: python tools/staging_provisioning_preauth_validate.py --packet docs/P5_STAGING_PROVISIONING_PREAUTH_PACKET_V0_1.json
      - name: Run provisioning preauthorization fail-closed tests
        run: python -m unittest tests/security/test_staging_provisioning_preauth.py -v


  staging-provisioning-operation-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate staging provisioning operation order
        run: python tools/staging_operation_order_validate.py --order docs/P5_STAGING_PROVISIONING_OPERATION_ORDER_V0_1.json
      - name: Run operation-order fail-closed tests
        run: python -m unittest tests/security/test_staging_operation_order.py -v
