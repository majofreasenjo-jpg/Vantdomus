name: DOMI R108 private affect ticket authority (disposable)

on:
  push:
    branches:
      - domi-r97-memory-safety-isolated-20261116
    paths:
      - "apps/api/postgres_staging_migrations/security/306_domi_r108_private_affect_ticket_candidate.sql"
      - "tests/security/test_domi_r108_private_affect_tickets_pg.py"
      - ".github/workflows/domi-r108-affect-ticket-authority-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-affect-tickets-disposable:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_rls_ci_not_a_secret
          POSTGRES_DB: domi_rls_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d domi_rls_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: ""
      VANTDOMUS_SKIP_LOCAL_ENV: "1"
      ANTHROPIC_API_KEY: ""
      ASSISTANT_EXTERNAL_CALLS_ALLOWED: "0"
      ASSISTANT_REAL_PROVIDER_ENABLED: "0"
      DOMI_AFFECT_R106_HTTP_LAB_ENABLED: "0"
      DOMI_RLS_REQUIRE_LIVE: "1"
      DOMI_RLS_TEST_DSN: postgresql://postgres:test_only_rls_ci_not_a_secret@127.0.0.1:5432/domi_rls_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Prove SQL voucher isolation on real disposable PostgreSQL
        run: python -m pytest tests/security/test_domi_r108_private_affect_tickets_pg.py -q -ra
