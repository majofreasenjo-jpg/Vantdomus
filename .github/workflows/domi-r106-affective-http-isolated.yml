name: DOMI R106 authenticated affect lab (offline)

on:
  push:
    branches:
      - domi-r97-memory-safety-isolated-20261116
    paths:
      - "apps/api/app/main.py"
      - "apps/api/app/assistant/affective_memory_bridge.py"
      - "apps/api/app/routes/assistant_affect_lab.py"
      - "tests/test_domi_r106_affect_http_lab.py"
      - ".github/workflows/domi-r106-affective-http-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affect-lab-http-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      APP_ENV: test
      VANTDOMUS_SKIP_LOCAL_ENV: "1"
      DATABASE_URL: ""
      ASSISTANT_REAL_PROVIDER_ENABLED: "0"
      ASSISTANT_EXTERNAL_CALLS_ALLOWED: "0"
      DOMI_ANTHROPIC_FAMILY_OPT_IN: "0"
      DOMI_AFFECT_R106_HTTP_LAB_ENABLED: "0"
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned development requirements
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Synthetic authenticated HTTP and historical privacy regression
        run: >-
          python -m pytest
          tests/test_domi_r106_affect_http_lab.py
          tests/test_domi_r105_affective_memory_bridge.py
          tests/test_domi_r104_micr_affect_kernel.py
          tests/test_domi_memory_identity_http.py
          -q
