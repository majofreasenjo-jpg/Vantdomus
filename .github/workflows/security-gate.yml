name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

# Cancel in-progress runs when a new commit arrives for the same ref.
concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Backend (Python) lint + tests + secret/CSP gates
  # ----------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt
          python -m pip install -r apps/api/requirements-dev.txt

      - name: Run metadata lint
        run: python apps/api/scripts/security_event_metadata_lint.py

      - name: Run secret scan
        run: python tools/secret_scan.py

      - name: Run web session security lint
        run: python tools/web_session_security_lint.py

      - name: Run web environment preflight
        run: python tools/web_env_preflight.py --env-file apps/web/.env.example

      - name: Run production readiness report (advisory)
        # Validates env-example completeness and forbidden-key rules.
        # `continue-on-error` because the report is advisory until the
        # legal/infra checklist closes.
        continue-on-error: true
        run: python tools/production_readiness_report.py

      - name: Backend tests — tenant isolation (must pass)
        run: |
          python -m pytest tests/security/test_tenant_isolation.py -q \
            --basetemp /home/runner/.cache/vantdomus-pytest -p no:cacheprovider

      - name: Backend tests — full suite (must pass)
        run: |
          python -m pytest tests/ -q \
            --basetemp /home/runner/.cache/vantdomus-pytest-full -p no:cacheprovider \
            --ignore=tests/security/test_tenant_isolation.py

      - name: Python dependency audit (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r apps/api/requirements.txt --strict


  # Real PostgreSQL RLS contract proof on synthetic data in a disposable CI
  # container. This job NEVER connects to Neon or deploys infrastructure.
  postgres-rls-pilot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_rls_ci_not_a_secret
          POSTGRES_DB: domi_rls_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d domi_rls_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disposable PostgreSQL pilot dependencies
        run: python -m pip install pytest psycopg2-binary==2.9.10 bcrypt==4.2.1 fastapi==0.111.0 python-jose==3.3.0 cryptography==42.0.0 pydantic-settings==2.3.4 httpx==0.27.0
      - name: Prove cross-household and cross-organization RLS in PostgreSQL
        env:
          DOMI_RLS_TEST_DSN: postgresql://postgres:test_only_rls_ci_not_a_secret@127.0.0.1:5432/domi_rls_ci
          DOMI_RLS_REQUIRE_LIVE: '1'
        run: python -m pytest tests/security/test_domi_pg_rls_pilot.py -q -ra
      - name: R49 live PostgreSQL auth catalog falsification
        env:
          DOMI_RLS_TEST_DSN: postgresql://postgres:test_only_rls_ci_not_a_secret@127.0.0.1:5432/domi_rls_ci
          DOMI_RLS_REQUIRE_LIVE: '1'
        run: python -m pytest tests/security/test_domi_pg_auth_readiness_live.py -q -ra
      - name: R31 full-schema 57-table RLS and personal memory negative tests
        env:
          DOMI_RLS_TEST_DSN: postgresql://postgres:test_only_rls_ci_not_a_secret@127.0.0.1:5432/domi_rls_ci
          DOMI_RLS_REQUIRE_LIVE: '1'
        run: python -m pytest tests/security/test_domi_r31_real_schema_rls.py -q -ra

  # ----------------------------------------------------------------------
  # R53 isolated R50 real-schema authentication candidate
  # Never share cluster-global auth roles/schemas with R8 pilot fixtures.
  # ----------------------------------------------------------------------
  postgres-real-auth-candidate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_rls_ci_not_a_secret
          POSTGRES_DB: domi_rls_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d domi_rls_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disposable PostgreSQL candidate dependencies
        run: python -m pip install pytest psycopg2-binary==2.9.10 bcrypt==4.2.1 fastapi==0.111.0 python-jose==3.3.0 cryptography==42.0.0 pydantic-settings==2.3.4 httpx==0.27.0
      - name: R53 create the 57-table RLS schema in an isolated cluster
        env:
          DOMI_RLS_TEST_DSN: postgresql://postgres:test_only_rls_ci_not_a_secret@127.0.0.1:5432/domi_rls_ci
          DOMI_RLS_REQUIRE_LIVE: '1'
        run: python -m pytest tests/security/test_domi_r31_real_schema_rls.py -q -ra
      - name: R53 apply R50 real auth SQL and prove fail-closed rollback
        env:
          DOMI_RLS_TEST_DSN: postgresql://postgres:test_only_rls_ci_not_a_secret@127.0.0.1:5432/domi_rls_ci
          DOMI_RLS_REQUIRE_LIVE: '1'
        run: python -m pytest tests/security/test_domi_r50_real_auth_sql.py -q -ra

  # ----------------------------------------------------------------------
  # Web (Next.js) typecheck + build + npm audit
  # ----------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck web
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build web panel
        working-directory: apps/web
        run: npm run build

      - name: npm audit (high & critical) — required
        working-directory: apps/web
        # Owner Beta stays isolated until high/critical production advisories are cleared.
        run: npm audit --omit=dev --audit-level=high

  # ----------------------------------------------------------------------
  # Mobile (Expo) typecheck + npm audit
  # ----------------------------------------------------------------------
  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: npm audit (high & critical)
        working-directory: apps/mobile
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # ----------------------------------------------------------------------
  # Staging smoke check (informational, runs only on push to main/master).
  # Skipped on PRs because it would require a reachable staging API.
  # ----------------------------------------------------------------------
  staging-smoke:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [backend, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install staging smoke dependencies
        run: python -m pip install requests

      - name: Run staging smoke check
        # Requires the staging API to be reachable from GitHub-hosted runners
        # and the SMOKE_* secrets to be configured in the repo.
        env:
          VANTDOMUS_SMOKE_API_BASE: ${{ secrets.SMOKE_API_BASE }}
          VANTDOMUS_SMOKE_WEB_BASE: ${{ secrets.SMOKE_WEB_BASE }}
        run: |
          if [ -z "$VANTDOMUS_SMOKE_API_BASE" ]; then
            echo "::warning::SMOKE_API_BASE not configured — skipping staging smoke check."
            exit 0
          fi
          python tools/staging_smoke_check.py
