name: DOMI R88 synthetic browser acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - domi-neon-staging-pg-startup-gate-20261010
    paths:
      - "apps/web/tests/domi-r88-browser-e2e.mjs"
      - "apps/web/tests/domi-r88-origin-security.test.mjs"
      - "apps/web/lib/domiSameOrigin.mjs"
      - "apps/web/app/api/proxy/**"
      - "apps/web/app/hogar/**"
      - "apps/web/app/components/domi/DomiCompanionHome.tsx"
      - "apps/web/app/components/DomiMemory.tsx"
      - "apps/web/app/components/MemoryLibrary.tsx"
      - "apps/web/lib/domiMemoryEvents.ts"
      - "apps/web/tests/domi-build-font-determinism.test.mjs"
      - ".github/workflows/domi-r88-browser-e2e.yml"

permissions:
  contents: read

concurrency:
  group: domi-r88-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-local-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API dependencies for disposable local SQLite only
        run: |
          python -m pip install -r apps/api/requirements.txt
      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Add test-only Playwright
        working-directory: apps/web
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install test-only Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify exact origin and CSRF negative cases
        working-directory: apps/web
        run: node --test tests/domi-r88-origin-security.test.mjs
      - name: Real browser, Next web, FastAPI HTTP, cold restart and isolation
        working-directory: apps/web
        run: node tests/domi-r88-browser-e2e.mjs
