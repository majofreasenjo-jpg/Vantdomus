name: DOMI G5 R3 G8 One-Shot Harness Certification

on:
  push:
    branches:
      - domi-g5-r3-autobiographical-history
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  g8-one-shot-harness-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify frozen R3 one-shot harness without executing subject
        working-directory: apps/web
        run: node --test tests/domi-g5-r3-one-shot-harness-freeze.test.mjs
