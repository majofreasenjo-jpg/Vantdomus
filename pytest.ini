[pytest]
; Suite determinista (CP1d-FAMILY-PILOT-1a):
; - solo se recolecta tests/ (nunca scripts sueltos del repo);
; - tests/manual/ contiene scripts legacy que llaman servicios externos y se
;   ejecutan SOLO a mano (python tests/manual/<script>.py) — jamas en pytest.
testpaths = tests
norecursedirs = tests/manual .venv node_modules .next .git
addopts = -p no:cacheprovider
