# Railway / Nixpacks config para el backend de VantDomus.
# Pensado para que el SERVICIO tenga Root Directory = apps/api (configurado en
# Railway → Settings → Source/Build → Root Directory). Con eso, Nixpacks ve el
# requirements.txt directamente y autodetecta Python sin necesidad de
# buildCommand explícito.

[build]
builder = "NIXPACKS"

[deploy]
# Importante: envolver en `sh -c` para que la shell expanda $PORT (Railway lo
# inyecta como env var). Sin sh -c, Nixpacks ejecuta uvicorn directo y pasa
# "$PORT" como string literal → "Invalid value for '--port'".
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
